[package]
name = "dynamic-island-cross"
version = "1.6.0"
description = "Dynamic Island for Windows, Linux & macOS"
authors = ["geevarghesekthomas84-sys"]
license = "MIT"
edition = "2024"

[lib]
name = "dynamic_island_cross_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.35"
battery = "0.7"
enigo = "0.2"
base64 = "0.22"


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_System_Power",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
  "Foundation_Collections",
  "UI_Notifications",
  "UI_Notifications_Management",
  "ApplicationModel",
] }
winreg = "0.55"
windows-core = "0.61"
